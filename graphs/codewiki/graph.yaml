kind: graph
description: 盘点仓库 → 并行编写页面 → 校验交付，生成固定格式的 CodeWiki（示例 Graph 工作流）。
steps:
  - id: survey
    desc: 盘点仓库并制定页面计划
    do: 盘点仓库并制定页面计划：读 `nodes/survey.md` 的「做什么」一节，按它执行。
    output: .ralphflow-codewiki/plan.json
    check: 读 `nodes/survey.md` 的「验收」一节，逐条核对并给出证据。
  - id: core-pages
    desc: 编写核心页面
    do: 编写核心页面并交付 manifest：读 `nodes/core-pages.md` 的「做什么」一节，按它执行。
    output: .ralphflow-codewiki/manifests/core.json
    depends_on:
      - survey
    check: 读 `nodes/core-pages.md` 的「验收」一节，逐条核对并给出证据。
  - id: module-pages
    desc: 编写模块页面
    do: 编写模块页面并交付 manifest：读 `nodes/module-pages.md` 的「做什么」一节，按它执行。
    output: .ralphflow-codewiki/manifests/modules.json
    depends_on:
      - survey
    check: 读 `nodes/module-pages.md` 的「验收」一节，逐条核对并给出证据。
  - id: operations-pages
    desc: 编写接口与运维页面
    do: 编写接口与运维页面并交付 manifest：读 `nodes/operations-pages.md` 的「做什么」一节，按它执行。
    output: .ralphflow-codewiki/manifests/operations.json
    depends_on:
      - survey
    check: 读 `nodes/operations-pages.md` 的「验收」一节，逐条核对并给出证据。
  - id: assemble
    desc: 组装索引、元数据并校验固定格式
    do: 组装索引与元数据并校验交付格式：读 `nodes/assemble.md` 的「做什么」一节，按它执行。
    output: .ralphflow-codewiki/delivery.json
    depends_on:
      - survey
      - core-pages
      - module-pages
      - operations-pages
    check: 读 `nodes/assemble.md` 的「验收」一节，逐条核对并给出证据。
