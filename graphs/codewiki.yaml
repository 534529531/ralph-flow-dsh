kind: graph
description: 盘点仓库 → 并行编写页面 → 校验交付，生成固定格式的 CodeWiki（示例 Graph 工作流）。
steps:
  - id: survey
    desc: 盘点仓库并制定页面计划
    do: |-
      先用 read 读取 `references/codewiki-format.md`；输出树、plan schema、模块树规则和校验清单以它为准。本步骤从 DO 顶部的「任务」读取 repository、outputDir、language：任务未指定时，repository 用 `.`，outputDir 用 `docs/codewiki`，language 用 `zh-CN`；值一旦确定就写进 plan，后续步骤只读 plan。

      1. 检查路径和输出安全。完成条件：repository 是工作区内相对路径；outputDir 是工作区内相对路径、是目录或不存在，且不等于 repository 根目录，也不等于 .ralphflow-codewiki；outputDir 不存在、为空，或是本工作流先前生成的目录（根目录有 metadata.json，schema 为 ralphflow-codewiki/metadata@1，generator 为 ralphflow-codewiki）。用原生 bash 清空并重建工作区暂存目录 .ralphflow-codewiki/；plan、manifests、delivery 是节点产物，由 ralphflow_artifact_write 写入本次运行的 artifact store，不在暂存目录复制。
      2. 处理先前输出。完成条件：只删除先前 metadata.files 中解析后仍位于 outputDir 内的文件、metadata.json 和 index.md，再删除空目录；删除后 outputDir 为空。outputDir 是文件、出现其他文件，或 metadata.files 中有越界路径时，把 plan.status 设为 blocked、blocked_reason 写明冲突路径，跳到第 8 步，并保持这些文件原样。
      3. 扫描 repository。完成条件：记录语言、源根、入口点、包清单、构建/测试/lint/CI 配置和模块导入边，每项都有文件路径来源；排除契约列出的目录、outputDir 和 .ralphflow-codewiki。
      4. 建立模块树。完成条件：按契约的源根、排除、1–12 页上限、other 聚合和 slug 规则生成 modules；每个未被排除的源文件至少属于一个模块或 coverage.uncovered；模块按 slug 字典序；少于 3 个可分离区域时在 assumptions 说明原因。
      5. 制定页面计划。完成条件：pages 包含 index、overview、architecture、workflows、interfaces、operations 和全部 modules/<slug>.md；每页有 path、kind、owner、title、source_paths、diagram_required；owner 按契约的固定映射填写；页面路径唯一；模块页与 modules 一一对应。
      6. 写 format 快照。完成条件：format.page_schema、frontmatter_keys、headings、required_diagrams、language 与契约中当前 language 的值逐字一致。
      7. 用 ralphflow_artifact_write 写 .ralphflow-codewiki/plan.json（引擎把它保存到本次运行的 artifact store；后续用 read 读取）。完成条件：JSON 可解析且符合契约 plan schema；source.repository、outputDir、language 与任务文本或默认值一致；source.commit 和 dirty 由 git 或 worktree 事实得出；commands 固定含 build、test、lint 三项；无法确认的项写入 assumptions。
      8. 完成自检。完成条件：plan.status 为 ready 时，所有 source_paths 在 repository 下存在，页面和模块数量符合规则；plan.status 为 blocked 时，blocked_reason 与实际冲突一致；文件不含 TODO、TBD 或占位符。
    output: .ralphflow-codewiki/plan.json
    check: |-
      1. plan.json 符合 随包 codewiki-format 参考 的 plan schema，status 为 ready，source.repository、source.outputDir、format.language 与任务文本或默认值一致。
      2. pages 恰好包含 index、overview、architecture、workflows、interfaces、operations 和与 modules 一一对应的模块页；每页 path、kind、owner、title、source_paths、diagram_required 完整，owner 符合固定映射，路径无重复。
      3. modules 数量在 1–12，slug 唯一且符合契约规则；每个 source_paths 在 repository 下存在；未被排除的源文件至少属于一个模块或 coverage.uncovered；超过 12 个时 other 页按契约聚合。
      4. format 的 page_schema、frontmatter_keys、headings、required_diagrams、language 与契约对应 language 的值逐字一致。
      5. source.source_roots 和 commands 的每个来源路径都在 repository 下存在；languages 从实际文件统计得出；无法确认的项在 assumptions 中说明，命令没有编造。
      6. 输出目录安全：ready 时没有删除或覆盖契约外文件的证据；blocked 时 blocked_reason 与实际冲突一致，且没有改动冲突文件。
      7. plan.json 可解析，generated_at 是有效 ISO 8601 时间，文件不含 TODO、TBD 或占位符。
  - id: core-pages
    desc: 编写核心页面
    do: |-
      先用 read 读取 `references/codewiki-format.md` 和 survey 产物；页面契约、manifest schema 以共享契约文件为准。repository、outputDir、language 以 survey 的 plan 为准。

      1. 从 plan.pages 取出 owner 为 core-pages 的页面。完成条件：页面集合恰好是 overview.md、architecture.md、workflows.md，没有缺页或多页。
      2. 阅读页面 source_paths 指向的代码、README、包清单和入口文件，为每条结论找到 path:line 来源。完成条件：每个要写的结论都有来源；无法验证的内容写入「未覆盖与假设」。
      3. 按页面契约写 overview.md、architecture.md、workflows.md 到 outputDir。完成条件：frontmatter 键序、标题、摘要、8 个 H2 的编号和文字与 plan.format 完全一致；architecture 和 workflows 各至少一个 mermaid 块。
      4. 写源码索引。完成条件：每页源码索引列出正文引用的全部路径，按字典序；每个路径在 repository 下存在。
      5. 用原生 write 写 outputDir 页面，用 ralphflow_artifact_write 写 .ralphflow-codewiki/manifests/core.json。完成条件：符合 manifest schema；files 恰好是三个页面；sha256、bytes、diagram_count、sources 与实际文件一致。
      6. 完成自检。完成条件：正文语言与 language 一致；没有 TODO、TBD、占位符或空章节；页面只引用 repository 中的事实和 plan.modules 中的模块。
    output: .ralphflow-codewiki/manifests/core.json
    depends_on:
      - survey
    check: |-
      1. manifest 符合 随包 codewiki-format 参考 的 manifest schema；files 恰好等于 plan 中 owner 为 core-pages 的页面；每项 path、kind、sha256、bytes、diagram_count、sources 与实际文件一致。
      2. overview.md、architecture.md、workflows.md 存在；frontmatter 键序、kind、source_commit、source_paths 与契约和 plan 一致；每页 8 个 H2 的编号和文字等于 plan.format.headings。
      3. architecture.md 和 workflows.md 各至少一个 mermaid 块，围栏闭合；图与正文描述一致。
      4. 每条代码事实带 path:line 来源；每页源码索引列出全部引用路径且路径存在；页面不引用 plan.modules 之外的模块。
      5. 正文语言与 language 一致；没有 TODO、TBD、占位符或空章节；无法验证的内容在「未覆盖与假设」中写明检查路径。
      6. 页面内容只来自 repository 的事实；接口、命令和符号没有编造。
  - id: module-pages
    desc: 编写模块页面
    do: |-
      先用 read 读取 `references/codewiki-format.md` 和 survey 产物；页面契约、manifest schema 以共享契约文件为准。repository、outputDir、language 以 survey 的 plan 为准。

      1. 从 plan.pages 取出 owner 为 module-pages 的页面，与 plan.modules 一一核对。完成条件：每个模块恰好一页，路径为 modules/<slug>.md；没有缺页、多页或计划外页面。
      2. 逐模块阅读 source_paths 下的代码和导入边，记录职责、入口、关系、流程、接口、约束和坑。完成条件：每个模块页的结论都有 path:line 来源；无法验证的内容写入「未覆盖与假设」。
      3. 按页面契约写每个模块页。完成条件：frontmatter、8 个 H2、标题和摘要与契约一致；每页至少一个 mermaid 块；模块间链接指向 plan.pages 中存在的模块页。
      4. 写源码索引和交叉链接。完成条件：每页源码索引列出的路径在 repository 下存在；所有相对链接可解析。
      5. 用原生 write 写全部模块页，用 ralphflow_artifact_write 写 .ralphflow-codewiki/manifests/modules.json。完成条件：符合 manifest schema；files 恰好是全部模块页；sha256、bytes、diagram_count、sources 与实际文件一致。
      6. 完成自检。完成条件：页面只描述分配给该模块的 source_paths；other 页说明聚合规则；没有 TODO、TBD、占位符或空章节。
    output: .ralphflow-codewiki/manifests/modules.json
    depends_on:
      - survey
    check: |-
      1. manifest 符合 随包 codewiki-format 参考 的 manifest schema；files 恰好等于 plan 中 owner 为 module-pages 的页面；每项 path、kind、sha256、bytes、diagram_count、sources 与实际文件一致。
      2. 每个模块页存在，路径与 slug 对应；frontmatter 键序、kind、source_commit、source_paths 与契约和 plan 一致；每页 8 个 H2 的编号和文字等于 plan.format.headings；没有缺页或多页。
      3. 每页至少一个 mermaid 块且围栏闭合；图与正文一致；模块间相对链接都指向存在的页面。
      4. 页面只描述 plan 分配给该模块的 source_paths；每条代码事实带 path:line 来源；源码索引路径存在；other 页说明聚合规则。
      5. 正文语言与 language 一致；没有 TODO、TBD、占位符或空章节；无法验证的内容在「未覆盖与假设」中写明检查路径。
      6. 模块页数量与 plan.modules 一致；页面标题、slug 和 source_paths 与 plan 一致。
  - id: operations-pages
    desc: 编写接口与运维页面
    do: |-
      先用 read 读取 `references/codewiki-format.md` 和 survey 产物；页面契约、manifest schema 以共享契约文件为准。repository、outputDir、language 以 survey 的 plan 为准。

      1. 从 plan.pages 取出 owner 为 operations-pages 的页面。完成条件：页面集合恰好是 interfaces.md 和 operations.md。
      2. 阅读接口、配置、构建、测试、CI/CD、部署、可观测性、安全、性能相关文件和命令，用实际路径和命令核对。完成条件：每个接口、命令和配置都有来源；无法验证的内容写入「未覆盖与假设」。
      3. 按页面契约写 interfaces.md 和 operations.md 到 outputDir。完成条件：frontmatter、8 个 H2、标题和摘要与契约一致；每个命令与仓库文件一致；N/A 项写明检查过的路径。
      4. 写源码索引。完成条件：每页源码索引列出的路径在 repository 下存在，按字典序。
      5. 用原生 write 写 outputDir 页面，用 ralphflow_artifact_write 写 .ralphflow-codewiki/manifests/operations.json。完成条件：符合 manifest schema；files 恰好是两页；sha256、bytes、diagram_count、sources 与实际文件一致。
      6. 完成自检。完成条件：正文语言与 language 一致；没有 TODO、TBD、占位符或空章节；接口和命令没有编造。
    output: .ralphflow-codewiki/manifests/operations.json
    depends_on:
      - survey
    check: |-
      1. manifest 符合 随包 codewiki-format 参考 的 manifest schema；files 恰好等于 plan 中 owner 为 operations-pages 的页面；每项 path、kind、sha256、bytes、diagram_count、sources 与实际文件一致。
      2. interfaces.md 和 operations.md 存在；frontmatter 键序、kind、source_commit、source_paths 与契约和 plan 一致；每页 8 个 H2 的编号和文字等于 plan.format.headings。
      3. 接口、命令和配置陈述都能在 repository 文件中找到来源；N/A 项写明检查过的路径；命令与仓库文件一致，没有编造。
      4. 构建、测试、CI/CD、部署、可观测性、安全、性能各有内容或带证据的 N/A；源码索引路径存在且按字典序。
      5. 正文语言与 language 一致；没有 TODO、TBD、占位符或空章节；无法验证的内容在「未覆盖与假设」中写明检查路径。
      6. 页面内容只来自 repository 的事实；接口和命令没有编造。
  - id: assemble
    desc: 组装索引、元数据并校验固定格式
    do: |-
      先用 read 读取 `references/codewiki-format.md`、survey 产物、core-pages 产物、module-pages 产物、operations-pages 产物；index、metadata、validation、delivery schema 以共享契约文件为准。repository、outputDir、language 以 survey 的 plan 为准。

      1. 核对输入。完成条件：plan.status 为 ready；三个 manifest 的 files 与 plan 中对应 owner 的页面完全一致，哈希与实际文件一致。不一致时停止写入 wiki，用原生 write 把差异写入工作区暂存目录 .ralphflow-codewiki/validation.json，保留现场供 CHECK 复核。
      2. 写 index.md。完成条件：阅读顺序、页面链接、页面依赖图、frontmatter 和 8 个 H2 符合契约；链接覆盖全部页面，不链接计划外页面。
      3. 写 metadata.json。完成条件：符合 metadata schema；files 覆盖除 metadata.json 外全部 wiki 文件，哈希、字节数、来源正确；modules 与 plan 一致；validation 先写 pending 和空 checks。
      4. 用原生 write 写工作区暂存目录 .ralphflow-codewiki/verify.mjs，实现契约的 10 项检查，支持 --check 和 --write。完成条件：脚本可执行；--check 只读并打印 JSON；--write 写出 validation.json。
      5. 运行 --check，修复自己负责的 index.md 和 metadata.json；上游页面缺陷保持原样并记录。完成条件：--check 退出码为 0，或失败项都来自上游页面且有明确证据。
      6. 运行 --write；通过后把 validation.status 和 checks 写回 metadata.json，再次运行 --check。完成条件：validation.status 为 passed；metadata.validation 与 validation.json 一致；--check 退出码为 0。
      7. 用 ralphflow_artifact_write 写 .ralphflow-codewiki/delivery.json（节点产物）；validation.json 由 verify.mjs 的 --write 写到工作区暂存目录。完成条件：符合 delivery schema；status、outputDir、entry、metadata、page_count、module_count、files 与实际一致；files 按路径字典序。
      8. 完成自检。完成条件：wiki 目录只含 plan.pages 和 metadata.json；没有临时文件；全部页面语言一致且无占位符。
    output: .ralphflow-codewiki/delivery.json
    depends_on:
      - survey
      - core-pages
      - module-pages
      - operations-pages
    check: |-
      1. index.md 和 metadata.json 存在；index 的 frontmatter、8 个 H2、阅读顺序、页面链接和页面依赖图符合契约；链接覆盖全部页面且不指向计划外页面。
      2. metadata 符合 随包 codewiki-format 参考 的 metadata schema；files 覆盖除 metadata.json 外全部 wiki 文件，路径、sha256、bytes、sources 与实际一致；modules 与 plan 一致；validation 与 validation.json 一致。
      3. validation.json 存在，10 项检查 id 齐全且全部 passed，evidence 指向实际文件；validation.command 可复现。
      4. 重跑 node .ralphflow-codewiki/verify.mjs <outputDir> --check 返回 0，输出与 validation.json 一致，且重跑不修改工作区文件。
      5. wiki 目录的文件集合恰好是 plan.pages 加 metadata.json；没有临时文件、内部文件或计划外文件。
      6. delivery.json 符合 delivery schema，status 为 passed，entry、metadata、validation 路径存在，files 覆盖全部 wiki 文件且哈希一致。
      7. 全部页面语言与 plan.format.language 一致；没有 TODO、TBD、占位符或空章节。
