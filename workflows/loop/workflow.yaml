description: 单步对抗验证循环：需求与边界、实际可用性、回归影响三个视角全部通过才结束

steps:
  - id: loop
    desc: 迭代执行任务直到通过对抗验证
    reset: true
    do: |
      按用户要求完成任务，控制修改范围，避免引入无关改动。

      每次交卷前，把本次交卷的摘要追加到 summary.md（一次交卷一节，保持精简）：
      - 本次交卷实际完成的事项（逐条对照任务要求）
      - 变更文件
      - 验证结果（命令与结果，或文件位置）
    input: 用户任务描述
    output: 实现的代码/文件
    check_voting:
      # 三个互补视角：需求与边界、实际可用性、回归影响。
      - check: 用户任务的每一条要求都已落实，没有遗漏，相关边界与异常情况已覆盖
      - check: 实现的行为和实际产出符合预期、真实可用，有可复核的验证依据
      - check: 修改不影响原有功能和既有约定，不引入需求以外的副作用
    on_pass: done
    on_fail: loop
    max_fail_count: 100
