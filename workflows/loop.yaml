description: 单步对抗验证循环：实现与验证在同一环节内迭代，直到通过

# 验证者模型可选（"provider/model"）；不填用默认模型。
# 验证超时不在 ralphflow 里设置：委派生命周期跟随宿主 dsh 的原生能力
# （宿主自带的请求级空闲看门狗负责卡死保护）。旧 YAML 里的 timeout_ms 会警告忽略。
# adversarial_check:
#   model: deepseek/deepseek-chat

steps:
  - id: loop
    desc: 迭代执行任务直到通过对抗验证
    do: |
      完成用户任务。

      每轮结束前，把执行摘要追加到 summary.md（多轮累积，每轮一节，保持精简）：
      - 完成事项（对照任务）
      - 变更文件
      - 验证结果
      - 未完成部分与下一步打算
    input: 用户任务描述
    output: 实现的代码/文件 + summary.md（执行摘要）
    check: |
      用户任务的每一条要求都已落实；
      实现的行为符合预期，真实可用；
      没有遗漏的需求，边界情况已覆盖。
    on_pass: done
    on_fail: loop
    max_fail_count: 100