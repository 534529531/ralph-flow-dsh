description: 单步对抗验证循环：实现与验证在同一环节内迭代，直到通过

# 验证者模型可选（"provider/model" 或 {providerID, modelID}）；不填沿用发起会话当前模型。
# 验证超时不在 ralphflow 里设置：委派生命周期跟随宿主 dsh 的原生能力
# （宿主自带的请求级空闲看门狗负责卡死保护）。
# ← 与 opencode 版 loop.yaml 的差异（刻意，不上移）：它在下面这个块里写 `timeout_ms`
#   （验证超时上限）；本引擎已把 `timeout_ms` 从公开契约中删除 —— 写了只会得到加载期
#   告警并忽略，所以这里不抄，超时仍归宿主原生看门狗。
# adversarial_check:
#   model: deepseek/deepseek-chat

steps:
  - id: loop
    desc: 迭代执行任务直到通过对抗验证
    # `reset: true` 与 opencode 一致 —— 它在这一步的注释原文是「单步轻量循环：失败重试频繁」。
    # 两种进入方式的行为（与 opencode 同构）：
    #   · **重试** → 返工走的是空闲窗口，**每轮都重置**（本步最多 100 轮）。这才是 loop 标 reset 的目的。
    #   · **首步初次进入** → 结构上无法重置：首步 DO 是 `ralphflow_start` 工具的返回值，替换会落在
    #     工具调用内部（孤儿 tool/result，静默损坏会话）。opencode 的 start 路径同样不检查 reset。
    #     标了会在启动回执里如实说明，绝不假装做过。
    reset: true
    do: |
      把任务做到位：它的每一条要求都成立。

      每轮交卷前，把本轮摘要**追加**到 summary.md（一轮一节，保持精简）：
      - 完成事项（逐条对照任务要求）
      - 变更文件
      - 验证结果
      - 未完成部分与下一步打算
    input: 用户任务描述
    output: 实现的代码/文件 + summary.md（执行摘要）
    check_voting:
      # 前三条逐字照抄 opencode 版 loop.yaml 的三票（各自只查一条）
      - check: 用户任务的每一条要求都已落实
      - check: 实现的行为符合预期，真实可用
      - check: 没有遗漏的需求，边界情况已覆盖
      # 第 4 票是本仓库自己的口径（opencode 版没有这一票）。
      # 只写判断、不写取证动作：内置工作流要对任意项目通用，不能假定项目有测试套件或 git 基线。
      - check: 修改不影响原有功能，不破坏需求以外的边界
    on_pass: done
    on_fail: loop
    max_fail_count: 100
