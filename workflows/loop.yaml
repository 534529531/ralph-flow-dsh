description: 单步对抗验证循环：需求与边界、实际可用性、回归影响三个视角全部通过才结束

# 验证者模型可选（"provider/model" 或 {providerID, modelID}）；不填沿用发起会话当前模型。
# 验证超时不在 ralphflow 里设置：委派生命周期跟随宿主 dsh 的原生能力
# （宿主自带的请求级空闲看门狗负责卡死保护）。
# ← 与 opencode 版 loop.yaml 的差异（刻意，不上移）：它在下面这个块里写 `timeout_ms`
#   （验证超时上限）；本引擎已把 `timeout_ms` 从公开契约中删除 —— 写了只会得到加载期
#   告警并忽略，所以这里不抄，超时仍归宿主原生看门狗。
# adversarial_check:
#   model: deepseek/deepseek-chat

steps:
  - id: loop
    desc: 迭代执行任务直到通过对抗验证
    # `reset: true` 与 opencode 一致 —— 它在这一步的注释原文是「单步轻量循环：失败重试频繁」。
    # 两种进入方式的行为（与 opencode 同构）：
    #   · **重试** → 返工走的是空闲窗口，**每轮都重置**（本步最多 100 轮）。这才是 loop 标 reset 的目的。
    #   · **首步初次进入** → 结构上无法重置：首步 DO 是 `ralphflow_start` 工具的返回值，替换会落在
    #     工具调用内部（孤儿 tool/result，静默损坏会话）。opencode 的 start 路径同样不检查 reset。
    #     标了会在启动回执里如实说明，绝不假装做过。
    reset: true
    do: |
      按用户要求完成任务，控制修改范围，避免引入无关改动。
      交卷前自行核验完成情况；没有验证依据的事项如实标为未验证，不把计划当作完成。

      每轮交卷前，把本轮摘要**追加**到 summary.md（一轮一节，保持精简）：
      - 完成事项（逐条对照任务要求）
      - 变更文件
      - 验证结果
      - 未完成部分与下一步打算

      summary.md 是**过程文档**：按提示词「产出目录」一节落在本实例产出目录里，不要写进工作目录。
    input: 用户任务描述
    # 交付物只说**产出什么**：这里只列产物；过程文档（summary.md 累积器）的落点由提示词
    # 「产出目录」一节决定，不列进这里 —— 否则与紧邻的「产出目录」打架，诱导模型两边都写。
    output: 实现的代码/文件
    check_voting:
      # 三个互补视角：需求与边界、实际可用性、回归影响；减少重复取证。
      # 检查依据只写判定目标，不假定项目有测试套件或 git 基线。
      - check: 用户任务的每一条要求都已落实，没有遗漏，相关边界与异常情况已覆盖
      - check: 实现的行为和实际产出符合预期、真实可用，有可复核的验证依据
      - check: 修改不影响原有功能和既有约定，不引入需求以外的副作用
    on_pass: done
    on_fail: loop
    max_fail_count: 100
