# Ralph Flow 内置工作流（与 claude/opencode 版共享方言，可自由编辑）
#
# 本文件与 opencode 版的 spec.yaml 同源（4 步：探索 → 提案 → 逐任务实现 → 归档）。
# 与 opencode 一致：propose / implement 标了 `reset: true`（重置门）——进入这两步前，
# 属主会话可见面被整段替换成一条「交接稿」，模型收到的 messages = 系统提示 + 交接稿 + 本步 DO。
# 载体与硬约束见 docs/v2/reset-feasibility.md 与 src/reset.ts。
#
# 注意：重置门只在**步骤边界的空闲窗口**生效，所以工作流**首步**（explore）无法重置——
# 首步的 DO 是 ralphflow_start 工具的返回值，在工具调用内部替换会静默损坏会话。
# 首步标 `reset: true` 时启动回执会如实说明（这里首步不标）。

description: 基于 OpenSpec 哲学重构的轻量迭代开发工作流——先探索、再提案、逐任务实现、最后归档。不做瀑布式长篇文档。

manual_step:
  - propose  # 审查门：propose 通过独立验证后停下等你放行

steps:
    # ── 1. 探索 → 提案草稿 ───────────────────────────────────────────────
    - id: explore
      desc: 需求探索
      do: |
        摸清需求与项目现状，产出一份能直接拍板的 proposal.md。

        1. 审视涉及的文件/模块，写清现状
        2. 评估可行方案并给出推荐方向（并列方案说明取舍）
        3. 输出 `proposal.md`（产物目录下），只写四节：
           - **为什么做**（问题/动机）
           - **做什么**（变更概述、范围、影响）
           - **怎么做**（技术方向；复杂需求可另写 `design.md`）
           - **验收标准**（可验证的完成条件）
        4. 全文控制在 1-2 页：规格细节留到 propose 或确实需要时再展开
      input: 用户提供的任务描述
      output: proposal.md（+ 可选 design.md）
      check: |
        打开 proposal.md 逐条核对：
        1. 动机与范围明确：能说出要改哪些文件/模块
        2. 每条验收标准都能由一个命令或一次检查判定真假
        3. 技术方向与需求规模相称
      on_pass: propose
      on_fail: explore
      max_fail_count: 3

    # ── 2. 提案定稿 + 任务拆解（人工审查门） ─────────────────────────────
    - id: propose
      desc: 提案与任务拆解
      reset: true   # ← 进入本步前换入干净上下文（交接稿 = 系统提示之后唯一的内容）；载体见 src/reset.ts
      do: |
        把 proposal.md 定稿，并拆成可逐项执行、逐项验证的 tasks.md。

        1. 读 explore 阶段产出的 proposal.md（有 design.md 一并读）
        2. 按用户反馈最终定稿 proposal.md
        3. 输出 `tasks.md`：按依赖顺序排列的 `- [ ]` 清单，每项 ≤ 50 行代码变动，且写明产出物
        4. 需求确实复杂而还没有 design.md 时：先补 `design.md`（架构、模块划分、接口设计），再拆 tasks.md
      input: proposal.md（来自 explore 产物目录）+ 用户意向
      output: 最终 proposal.md + tasks.md（+ 可选 design.md）
      check: |
        打开 tasks.md 与 proposal.md 交叉核对：
        1. proposal 的每条验收标准都有任务承接（逐条点名）
        2. 每项 ≤ 50 行代码变动、写明产出物，且单独一项就能判定完成
        3. 顺序满足前置依赖（前置在前、后置在后）
      on_pass: implement
      on_fail: propose
      max_fail_count: 3

    # ── 3. 逐任务实现（opencode 在此有重置门：干净的上下文开始编码）─────
    - id: implement
      desc: 逐任务实现
      reset: true   # ← 干净的上下文开始编码（交接稿 = 系统提示之后唯一的内容）；载体见 src/reset.ts
      do: |
        按 tasks.md 逐任务实现，每完成一项就勾掉一项。

        for each task in tasks.md:
          1. 读该任务的目标与产出物
          2. 实现——遵循项目代码风格
          3. 自验——跑 lint/typecheck/test
          4. 通过后把 tasks.md 里该行的 `- [ ]` 改成 `- [x]`

        实现过程中：
        - 发现设计遗漏就直接改设计文档
        - 每任务单独一个提交
        - 这一步只改代码：新文档留给 propose 与 archive
        全部完成时 tasks.md 的每一项都是 `- [x]`。
      input: "tasks.md（+ 可选 design.md）"
      output: 实现的代码文件 + 全部勾选的 tasks.md
      check: |
        打开 tasks.md 与仓库逐条取证：
        1. 每一项都是 `- [x]`（出现 `- [ ]` 即不通过）
        2. 真跑项目的测试命令，输出全绿
        3. 真跑 lint/typecheck，零错误
        4. 在改动过的源码里搜不到 TODO / FIXME / debugger / console.log
      on_pass: archive
      on_fail: implement
      max_fail_count: 5

    # ── 4. 归档 ──────────────────────────────────────────────────────────
    - id: archive
      desc: 归档总结
      do: |
        1. 确认 tasks.md 全部打勾、项目测试全绿
        2. 输出 `summary.md`：一句话总结 + 变更了多少文件 + 遗留问题
      input: 全部产出 + 实现代码
      output: "summary.md"
      check: |
        打开 summary.md 与 tasks.md 核对：
        1. summary.md 存在，含一句话总结、变更文件数与遗留问题（没有遗留就写「无」）
        2. tasks.md 每一项都是 `- [x]`
        3. 真跑项目的测试命令，输出全绿
      on_pass: done
      on_fail: implement
      max_fail_count: 3
