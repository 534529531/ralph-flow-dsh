# Ralph Flow 内置工作流（与 claude/opencode 版共享方言，可自由编辑）
#
# 本文件与 opencode 版的 spec.yaml 同源（4 步：探索 → 提案 → 逐任务实现 → 归档）。
# 与 opencode 一致：propose / implement 标了 `reset: true`（重置门）——进入这两步前，
# 属主会话可见面被整段替换成一条「交接稿」，模型收到的 messages = 系统提示 + 交接稿 + 本步 DO。
# 载体与硬约束见 docs/v2/reset-feasibility.md 与 src/reset.ts。
#
# 注意：重置门只在**步骤边界的空闲窗口**生效，所以工作流**首步**（explore）无法重置——
# 首步的 DO 是 ralphflow_start 工具的返回值，在工具调用内部替换会静默损坏会话。
# 首步标 `reset: true` 时启动回执会如实说明（这里首步不标）。

description: 基于 OpenSpec 哲学重构的轻量迭代开发工作流——先探索、再提案、逐任务实现、最后归档。不做瀑布式长篇文档。

manual_step:
  - propose  # 审查门：propose 通过独立验证后停下等你放行

steps:
    # ── 1. 探索 → 提案草稿 ───────────────────────────────────────────────
    - id: explore
      desc: 需求探索
      do: |
        先调查用户需求与项目现状，形成可供定方向的 proposal.md。

        1. 读取相关实现、项目约定和现有验证入口，区分观察到的现状与尚待确认的假设。
        2. 将用户要求、补充约束与已确认的决定写入 proposal.md；确实阻塞方向的问题先向用户确认。
        3. proposal.md 写四节：为什么做；做什么（范围、约束与不涉及事项）；怎么做（推荐方向及必要取舍）；验收标准（逐条对应需求，写清可观察结果与验证方法）。
        4. 以能作方向判断为完成条件，保持精简；需要时用 design.md 说明关键接口或风险。实现留给后续步骤。
      input: 用户提供的任务描述
      output: proposal.md（+ 可选 design.md）
      check: |
        读取 proposal.md，必要时核对相关实现与项目约定：
        1. 需求、范围和已知约束完整，现状判断有依据，阻塞方向的问题已解决或明确指出。
        2. 每条需求都有可判定的验收标准，描述可观察结果及验证方法；方法适合本项目。
        3. 推荐方向可行且与需求规模相称，关键取舍明确；不以计划中的实现冒充已完成成果。
      on_pass: propose
      on_fail: explore
      max_fail_count: 3

    # ── 2. 提案定稿 + 任务拆解（人工审查门） ─────────────────────────────
    - id: propose
      desc: 提案与任务拆解
      reset: true   # ← 进入本步前换入干净上下文（交接稿 = 系统提示之后唯一的内容）；载体见 src/reset.ts
      do: |
        从本实例产出目录读取 proposal.md 和已有 design.md，定稿方案并拆为 tasks.md。

        1. 以文档中的需求和决定为交接依据；有用户新反馈时先更新 proposal.md，使重置后的下一步仍能恢复这些约束。
        2. 按依赖顺序写 tasks.md 的 - [ ] 清单。每项标识稳定，写清目标、交付物、前置依赖、对应验收标准和验证方法；按可独立验证的工作拆分，粒度由实际任务决定。
        3. 技术风险或接口约定需要展开时补 design.md；使方案、设计与任务互相一致。
        4. 交卷的是待用户批准的完整方案与清单。审查门上的用户修改须同步到上述文件，改完重新交卷。
      input: proposal.md（本实例产出目录，含需求与已确认决定）
      output: 最终 proposal.md + tasks.md（+ 可选 design.md）
      check: |
        交叉读取 proposal.md、tasks.md 与已有 design.md：
        1. proposal 的每条验收标准都有明确任务承接，任务覆盖需求而没有无关扩张。
        2. 每项有目标、交付物、依赖与可执行的验证方法，可独立判断完成；顺序符合依赖。
        3. 文档对范围、接口和决定的描述一致，阻塞实施的未知项已解决。清单完整可执行即满足本步，不要求实现代码或任务已勾选。
      on_pass: implement
      on_fail: propose
      max_fail_count: 3

    # ── 3. 逐任务实现（opencode 在此有重置门：干净的上下文开始编码）─────
    - id: implement
      desc: 逐任务实现
      reset: true   # ← 干净的上下文开始编码（交接稿 = 系统提示之后唯一的内容）；载体见 src/reset.ts
      do: |
        先读 proposal.md、tasks.md 与已有 design.md，从文件恢复已批准的范围和约束。逐项实施：

        1. 核对该任务当前实际状态；即使已勾选也检查已有证据是否仍有效，失效则重新打开该项。
        2. 按依赖实现，遵循项目约定，同时更新本任务必需的测试与使用文档。
        3. 从项目配置寻找适用的验证入口；运行与本项及改动影响相关的检查。记录命令、结果与证据位置；项目没有某类工具时选能验证目标的替代方法，明确适用范围。
        4. 产出与验证依据齐全后才改为 - [x]，在 tasks.md 对应项记录证据；未完成或缺关键证据的项保持 - [ ]。
        5. 全部任务完成后，对照 proposal.md 验收标准检查整体行为和回归影响。

        发现遗漏时更新相关记录；影响已批准范围、关键接口或验收标准的变化先说明影响并请用户确认，得到决定后再同步文档。Git 提交按用户指示或项目约定执行。
      input: "proposal.md + tasks.md（+ 已有 design.md）"
      output: 实现的代码文件 + 全部勾选且含验证证据的 tasks.md（有方案或设计变更时同步相应文档）
      check: |
        交叉读取 proposal.md、tasks.md、已有 design.md 与实际产出，逐项独立取证：
        1. 每项均已勾选且对应产出真实存在、满足目标；勾选与执行者自述本身不构成完成证据。
        2. proposal 的每条验收标准在实际行为或产出上成立，实施与已记录的范围、接口和决定一致。
        3. 从项目配置发现适用的测试、静态检查等入口，运行与改动相关的验证并检查结果。不存在的工具不作为失败条件，须有能覆盖目标的替代证据；关键目标无法验证时写清证据缺口。
        4. 检查改动影响与项目既有约定，只将影响交付或违反要求的具体问题作为失败依据。
      on_pass: archive
      on_fail: implement
      max_fail_count: 5

    # ── 4. 归档 ──────────────────────────────────────────────────────────
    - id: archive
      desc: 归档总结
      do: |
        读取 proposal.md、tasks.md、已有 design.md 与当前产出，输出 summary.md：
        1. 逐条对照验收标准与任务证据，确认结论对应当前产出。
        2. 写清交付结果、关键变更与文件位置、验证方法和结果、使用或后续维护所需信息。
        3. 写清遗留问题、验证范围及限制；没有遗留问题才写“无”。摘要是证据索引，便于独立复核。
        归档本步已有结论；发现实现缺口时如实指出，交由验证与返工处理。
      input: 全部产出 + 实现代码
      output: "summary.md"
      check: |
        读取 summary.md、proposal.md 与 tasks.md，核对其引用的实际产出和证据：
        1. summary.md 的交付、关键变更、验证结果及遗留项完整，证据位置可查，结论与当前产出一致。
        2. 所有任务均已勾选，并有实际产出与验证依据；需求验收标准没有遗漏。
        3. 摘要没有把未完成或未验证事项说成完成。只有证据过期或矛盾时再运行对应检查，不重复要求与改动无关的整套工具链。
      on_pass: done
      on_fail: implement
      max_fail_count: 3
